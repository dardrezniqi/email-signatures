<!--
  SIGNATURE 04 — SIGNATURE + PROMO BANNER (the "email ad" variant)
  Signature block, then a full-width promo strip with a call-to-action button.

  The button is bulletproof: Outlook Classic gets a VML <v:roundrect>, every
  other client gets a padded <a>. Outlook's Word engine ignores padding on
  anchors, so without the VML half the button collapses to plain blue text.
  Only one of the two ever renders — the conditional comments make sure of it.

  The banner keeps the CTA as live text rather than baking it into the image,
  so it still reads when images are blocked, which is Outlook's default.

  REPLACE BEFORE USE: every src="https://REPLACE-ME..." and the button href.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {
    .sig-wrap      { width: 100% !important; }
    .sig-stack     { display: block !important; width: 100% !important; }
    .sig-photo-td  { display: block !important; width: 100% !important; padding: 0 0 12px 0 !important; }
    .sig-body-td   { display: block !important; width: 100% !important; padding: 0 !important; }
    .sig-name      { font-size: 17px !important; }
    /* Banner: text over the button instead of beside it */
    .ban-stack     { display: block !important; width: 100% !important; }
    .ban-copy-td   { display: block !important; width: 100% !important; padding: 0 0 12px 0 !important; text-align: left !important; }
    .ban-cta-td    { display: block !important; width: 100% !important; padding: 0 !important; text-align: left !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-bg      { background-color: #1c1c1e !important; }
    .sig-name    { color: #f5f5f7 !important; }
    .sig-role    { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a  { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a{ color: #7fb0ff !important; }
    .sig-hair    { background-color: #3a3a3c !important; }
    .ban-panel   { background-color: #232325 !important; }
    .ban-head    { color: #f5f5f7 !important; }
    .ban-sub     { color: #a1a1a6 !important; }
  }

  [data-ogsc] .sig-bg     { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #7fb0ff !important; }
  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }
  [data-ogsc] .ban-panel  { background-color: #232325 !important; }
  [data-ogsc] .ban-head   { color: #f5f5f7 !important; }
  [data-ogsc] .ban-sub    { color: #a1a1a6 !important; }
</style>
</head>

<body style="margin:0; padding:0;">
