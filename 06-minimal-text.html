<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Email Signature 06 - Minimal, no images</title>

<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<![endif]-->

<!--
  SIGNATURE 06 - MINIMAL, ZERO IMAGES

  No logo, no photo, no icons, nothing to host. Which means:
  - It cannot break. Image blocking, broken CDN, an expired domain, a client
    that strips remote content - none of it touches this one.
  - It never trips a spam filter on image-to-text ratio.
  - It weighs about 1.5 KB, so Gmail's 102 KB clipping is a non-issue even at
    the bottom of a long thread.

  The coloured block on the left is a table cell with bgcolor, so it survives
  everywhere a border-left would not.

  This is the version to give a client who says "keep it simple" and means it,
  and the safest default for anyone sending high volume.

  Nothing to replace before use.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {
    .sig-wrap { width: 100% !important; }
    .sig-name { font-size: 16px !important; }
    .sig-meta { font-size: 13px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-bg     { background-color: #1c1c1e !important; }
    .sig-name   { color: #f5f5f7 !important; }
    .sig-role   { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a { color: #7fb0ff !important; }
    .sig-bar    { background-color: #7fb0ff !important; }
    .sig-dot    { color: #5a5a5e !important; }
  }

  [data-ogsc] .sig-bg     { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #7fb0ff !important; }
  [data-ogsc] .sig-bar    { background-color: #7fb0ff !important; }
  [data-ogsc] .sig-dot    { color: #5a5a5e !important; }
</style>
</head>

<body style="margin:0; padding:0;">

<!-- ===== SIGNATURE START ===== -->

          </td>
        </tr>

        <tr>
          <td class="sig-meta" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#3a3a3c;">
