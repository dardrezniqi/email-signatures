<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Email Signature 01 — Classic Divider</title>

<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<![endif]-->

<!--
  SIGNATURE 01 — CLASSIC DIVIDER
  Photo left, 1px rule, details right.

  Everything below the <style> block is inline-styled and table-based, so the
  signature is complete on its own. The <style> block only adds dark mode and
  mobile stacking for the clients that read it. Outlook Classic strips <style>
  when you paste into Signatures, and that is fine — it falls back to the
  inline layout, which is what Outlook renders best anyway.

  REPLACE BEFORE USE: every src="https://REPLACE-ME..." with your hosted image URL.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  /* Stop iOS from restyling auto-detected phone numbers and addresses */
  a[x-apple-data-detectors] {
    color: inherit !important;
    text-decoration: none !important;
    font-size: inherit !important;
    font-family: inherit !important;
    font-weight: inherit !important;
    line-height: inherit !important;
  }

  /* --- Mobile: drop the photo column under the text --- */
  @media only screen and (max-width: 480px) {
    .sig-wrap      { width: 100% !important; }
    .sig-stack     { display: block !important; width: 100% !important; }
    .sig-photo-td  { display: block !important; width: 100% !important; padding: 0 0 12px 0 !important; text-align: left !important; }
    .sig-rule-td   { display: none !important; }
    .sig-body-td   { display: block !important; width: 100% !important; padding: 0 !important; }
    .sig-name      { font-size: 17px !important; }
    .sig-meta      { font-size: 13px !important; line-height: 20px !important; }
  }

  /* --- Dark mode --- */
  @media (prefers-color-scheme: dark) {
    .sig-bg      { background-color: #1c1c1e !important; }
    .sig-name    { color: #f5f5f7 !important; }
    .sig-role    { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a  { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a{ color: #4ade80 !important; }
    .sig-rule    { background-color: #3a3a3c !important; }
    .sig-hair    { background-color: #3a3a3c !important; }
  }

  /* Outlook.com / older Office 365 web dark mode hooks */
  [data-ogsc] .sig-bg     { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #4ade80 !important; }
  [data-ogsc] .sig-rule   { background-color: #3a3a3c !important; }
  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }
</style>
</head>

<body style="margin:0; padding:0;">

<!-- ===== SIGNATURE START — copy from here ===== -->
<table class="sig-wrap sig-bg" role="presentation" cellpadding="0" cellspacing="0" border="0" width="470"
       style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; width:470px; max-width:470px; background-color:#ffffff; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <tr>
    <td style="padding:0;">

      <table class="sig-stack" role="presentation" cellpadding="0" cellspacing="0" border="0"
             style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
        <tr>

          <!-- Photo -->
          <td class="sig-photo-td" valign="top" width="84" style="padding:0 18px 0 0; width:84px;">
            <img src="https://dardrezniqi.github.io/email-signatures/dard-rezniqi.png"
                 width="84" height="84" alt="Dard Rezniqi"
                 style="display:block; width:84px; height:84px; border:0; outline:none; text-decoration:none; border-radius:6px; -ms-interpolation-mode:bicubic;">
          </td>

          <!-- 1px vertical rule. A td with a fixed-width div inside is the only
               version Outlook's Word engine draws reliably at 1px. -->
          <td class="sig-rule-td" valign="top" width="1" style="width:1px; padding:0 18px 0 0; font-size:0; line-height:0;">
            <div class="sig-rule" style="width:1px; height:88px; background-color:#e3e3e6; font-size:0; line-height:0;">&nbsp;</div>
          </td>

          <!-- Details -->
          <td class="sig-body-td" valign="top" style="padding:0;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                   style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

              <tr>
                <td class="sig-name" style="padding:0 0 1px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:18px; line-height:24px; mso-line-height-rule:exactly; font-weight:700; color:#1a1a1c; letter-spacing:-0.2px;">
                  Dard Rezniqi
                </td>
              </tr>

              <tr>
                <td class="sig-role" style="padding:0 0 10px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:18px; mso-line-height-rule:exactly; color:#6e6e73;">
                  Software Developer
                </td>
              </tr>

              <!-- Hairline. Spacer rows carry &nbsp; with font-size:0 so Outlook
                   doesn't add a phantom line of leading. -->
              <tr>
                <td class="sig-hair" height="1" style="height:1px; font-size:0; line-height:0; background-color:#e3e3e6;">&nbsp;</td>
              </tr>
              <tr>
                <td height="10" style="height:10px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>

              <tr>
                <td class="sig-meta" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#3a3a3c;">
                  <a href="tel:+38349812525" style="color:#3a3a3c; text-decoration:none;">+383 49 812 525</a>
                  &nbsp;&middot;&nbsp;
                  <a href="mailto:dard.rezniqi@gmail.com" style="color:#3a3a3c; text-decoration:none;">dard.rezniqi@gmail.com</a>
                </td>
              </tr>

              <tr>
                <td class="sig-meta" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#3a3a3c;">
                  <a href="https://maps.google.com/?q=Prishtina,%20Kosovo" style="color:#3a3a3c; text-decoration:none;">Prishtina, Kosovo</a>
                </td>
              </tr>

              <tr>
                <td height="4" style="height:4px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>

              <tr>
                <td class="sig-accent" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#15803d;">
                  <a href="https://github.com/dardrezniqi" style="color:#15803d; text-decoration:none; font-weight:600;">GitHub</a>
                  &nbsp;&middot;&nbsp;
                  <a href="https://linkedin.com/in/dard-rezniqi" style="color:#15803d; text-decoration:none; font-weight:600;">LinkedIn</a>
                </td>
              </tr>

            </table>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
<!-- ===== SIGNATURE END ===== -->

</body>
</html>
