<!--
  SIGNATURE 07 - REVERSED HEADER BAR
  Second direction for the same mock client, same brand colour as 05.

  The reversed bar is the single most dangerous thing you can put in a
  signature, and it is worth knowing why. White text sits on a solid brand
  fill. Some clients "helpfully" invert light backgrounds in dark mode but
  leave the text alone - and you get white on white, an invisible header, and
  a client emailing you a screenshot.

  Three defences, all present below:
  1. The fill is set twice, as the bgcolor attribute and as an inline
     background-color. Clients that strip one usually honour the other.
  2. The fill is a mid-dark amber, not a light tint. Inversion algorithms
     mostly leave already-dark backgrounds alone.
  3. The dark-mode rule sets the bar to the SAME family rather than flipping
     it, so even where the media query lands nothing swaps out from under it.

  REPLACE BEFORE USE: every src="https://REPLACE-ME..." with a hosted URL.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {
    .sig-wrap    { width: 100% !important; }
    .sig-barname { font-size: 14px !important; letter-spacing: 1px !important; }
    .sig-bartag  { display: none !important; }
    .sig-name    { font-size: 17px !important; }
    .sig-body    { padding: 14px 16px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-body   { background-color: #1c1c1e !important; }
    .sig-name   { color: #f5f5f7 !important; }
    .sig-role   { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a { color: #f0a04b !important; }
    .sig-hair   { background-color: #3a3a3c !important; }
    /* Bar stays in the same family on purpose - see the note above */
    .sig-bar    { background-color: #b45309 !important; }
  }

  [data-ogsc] .sig-body   { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #f0a04b !important; }
  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }
  [data-ogsc] .sig-bar    { background-color: #b45309 !important; }
</style>
</head>

<body style="margin:0; padding:0;">
