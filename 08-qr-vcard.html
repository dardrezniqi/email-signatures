<!--
  SIGNATURE 08 - QR vCARD + SOCIAL ROW

  Three columns: details, social icons, QR. The QR encodes a full vCard, so
  someone reading the email on a laptop can point a phone at it and have the
  contact saved without typing anything.

  The QR is the reason this one needs care:
  - It is a real image, so if images are blocked it is gone. Everything the QR
    contains is therefore also present as text and as tel:/mailto: links. The
    QR is a shortcut, never the only route.
  - QR readers need contrast. On dark backgrounds an inverted QR still scans
    on most modern phone cameras but not all, so the dark variant is a
    separately generated image with a dark quiet zone rather than a CSS filter.
  - The quiet zone (the white margin) is part of the spec. Cropping it to save
    space is the most common reason a signature QR fails to scan.

  There is also a "Save contact" button underneath in VML + HTML, pointing at
  a hosted .vcf, for anyone who is on the same device and cannot scan. It is an
  outline button, which is the one button style that needs an explicit fill and
  an explicit dark-mode colour - dark ink on a transparent background reads
  fine on white and vanishes completely on a dark one.

  REPLACE BEFORE USE: every src="https://REPLACE-ME..." and the .vcf href.
-->

<style type="text/css">

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {

    .sig-soc-td  { display: block !important; width: 100% !important; padding: 0 0 14px 0 !important; }
    /* On a phone you are already holding the phone - the QR is useless there */
    .sig-qr-td   { display: none !important; }
    .sig-name    { font-size: 17px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-bg     { background-color: #1c1c1e !important; }
    .sig-name   { color: #f5f5f7 !important; }
    .sig-role   { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a { color: #4ade80 !important; }
    .sig-hair   { background-color: #3a3a3c !important; }
    .sig-qrcap  { color: #8e8e93 !important; }
    .sig-btn    { color: #f5f5f7 !important; border-color: #5a5a5e !important; background-color: #1c1c1e !important; }
  }

  [data-ogsc] .sig-bg     { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,

  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }

  [data-ogsc] .sig-btn    { color: #f5f5f7 !important; border-color: #5a5a5e !important; background-color: #1c1c1e !important; }
</style>
