<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Email Signature 03 — Accent Card</title>

<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>

<!--
  SIGNATURE 03 — ACCENT CARD
  Tinted panel with a solid accent bar down the left edge.

  Two things worth knowing here:
  1. The accent bar is a 4px-wide td with bgcolor, not a border-left. Outlook
     Classic collapses thin borders unpredictably; a filled cell always draws.
  2. The panel has no border-radius. Outlook Classic squares corners off, so
     rounding it would mean the signature looks different in the one client
     that matters most for this brief. Square everywhere beats rounded in three
     clients and square in the fourth.

  REPLACE BEFORE USE: src="https://REPLACE-ME..." with your hosted image URL.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {
    .sig-wrap     { width: 100% !important; }
    .sig-inner    { display: block !important; width: 100% !important; }
    .sig-photo-td { display: block !important; width: 100% !important; padding: 0 0 12px 0 !important; }
    .sig-body-td  { display: block !important; width: 100% !important; padding: 0 !important; }
    .sig-pad      { padding: 16px !important; }
    .sig-name     { font-size: 17px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-panel  { background-color: #232325 !important; }
    .sig-name   { color: #f5f5f7 !important; }
    .sig-role   { color: #a1a1a6 !important; }
    .sig-meta,
    .sig-meta a { color: #d6d6d8 !important; }
    .sig-accent,
    .sig-accent a { color: #7fb0ff !important; }
    .sig-bar    { background-color: #7fb0ff !important; }
    .sig-hair   { background-color: #3a3a3c !important; }
  }

  [data-ogsc] .sig-panel  { background-color: #232325 !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #7fb0ff !important; }
  [data-ogsc] .sig-bar    { background-color: #7fb0ff !important; }
  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }
</style>
</head>

<body style="margin:0; padding:0;">

<!-- ===== SIGNATURE START — copy from here ===== -->
<table class="sig-wrap" role="presentation" cellpadding="0" cellspacing="0" border="0" width="470"

  <tr>

    <!-- Accent bar -->
    <td class="sig-bar" width="4" bgcolor="#2563eb" style="width:4px; background-color:#2563eb; font-size:0; line-height:0;">&nbsp;</td>

    <!-- Panel -->
    <td class="sig-panel sig-pad" bgcolor="#f6f7f9" style="background-color:#f6f7f9; padding:18px 20px;">

      <table class="sig-inner" role="presentation" cellpadding="0" cellspacing="0" border="0"
             style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

          <td class="sig-body-td" valign="top" style="padding:0;">

            <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                   style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

              <tr>
                <td class="sig-name" style="padding:0 0 1px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:18px; line-height:24px; mso-line-height-rule:exactly; font-weight:700; color:#1a1a1c; letter-spacing:-0.2px;">
                  Dard Rezniqi
                </td>
              </tr>

              <tr>
                <td class="sig-role" style="padding:0 0 9px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:18px; mso-line-height-rule:exactly; color:#6e6e73;">
                  Software Developer &nbsp;&middot;&nbsp; Prishtina, Kosovo
                </td>
              </tr>

              <tr>
                <td class="sig-hair" height="1" style="height:1px; font-size:0; line-height:0; background-color:#dcdce0;">&nbsp;</td>
              </tr>
              <tr>
                <td height="9" style="height:9px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>

              <tr>
                <td class="sig-meta" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#3a3a3c;">
                  <a href="tel:+38349812525" style="color:#3a3a3c; text-decoration:none;">+383 49 812 525</a>

              <tr>
                <td class="sig-meta" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#3a3a3c;">
                  <a href="mailto:dard.rezniqi@gmail.com" style="color:#3a3a3c; text-decoration:none;">dard.rezniqi@gmail.com</a>
                </td>
              </tr>

              <tr>
                <td height="4" style="height:4px; font-size:0; line-height:0;">&nbsp;</td>
              </tr>

              <tr>
                <td class="sig-accent" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:21px; mso-line-height-rule:exactly; color:#2563eb;">
                  <a href="https://github.com/dardrezniqi" style="color:#2563eb; text-decoration:none; font-weight:600;">GitHub</a>
                  &nbsp;&middot;&nbsp;
                  <a href="https://linkedin.com/in/dard-rezniqi" style="color:#2563eb; text-decoration:none; font-weight:600;">LinkedIn</a>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
