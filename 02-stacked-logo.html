<!DOCTYPE html>
<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Email Signature 02 — Stacked Logo</title>

<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<![endif]-->

<!--
  SIGNATURE 02 — STACKED LOGO
  Wordmark on top, name block, labelled contact rows.

  The label column ("Tel / Email / Web") is a fixed-width td rather than a
  text-indent, because Outlook Classic ignores text-indent inside table cells.

    Everything sits inside one padded cell rather than starting flush at the
  edge. Padding on a <td> is the only inset Outlook honours reliably - margin
  on the table, or padding on the table itself, both get dropped by Word.

  REPLACE BEFORE USE: src="https://REPLACE-ME..." with your hosted logo URL.
-->

<style type="text/css">
  :root { color-scheme: light dark; supported-color-schemes: light dark; }

  a[x-apple-data-detectors] {
    color: inherit !important; text-decoration: none !important;
    font-size: inherit !important; font-family: inherit !important;
    font-weight: inherit !important; line-height: inherit !important;
  }

  @media only screen and (max-width: 480px) {
    .sig-wrap  { width: 100% !important; }
    .sig-name  { font-size: 17px !important; }
    .sig-meta  { font-size: 13px !important; }
    .sig-label { width: 46px !important; }
  }

  @media (prefers-color-scheme: dark) {
    .sig-bg     { background-color: #1c1c1e !important; }
    .sig-name   { color: #f5f5f7 !important; }
    .sig-role   { color: #a1a1a6 !important; }
    .sig-label  { color: #8e8e93 !important; }
    .sig-meta,
    .sig-meta a { color: #d6d6d8 !important; }
    .sig-hair   { background-color: #3a3a3c !important; }
    .sig-accent,
    .sig-accent a { color: #4ade80 !important; }
  }

  [data-ogsc] .sig-bg     { background-color: #1c1c1e !important; }
  [data-ogsc] .sig-name   { color: #f5f5f7 !important; }
  [data-ogsc] .sig-role   { color: #a1a1a6 !important; }
  [data-ogsc] .sig-label  { color: #8e8e93 !important; }
  [data-ogsc] .sig-meta,
  [data-ogsc] .sig-meta a { color: #d6d6d8 !important; }
  [data-ogsc] .sig-hair   { background-color: #3a3a3c !important; }
  [data-ogsc] .sig-accent,
  [data-ogsc] .sig-accent a { color: #4ade80 !important; }
</style>
</head>

<body style="margin:0; padding:0;">

<!-- ===== SIGNATURE START — copy from here ===== -->
<table class="sig-wrap sig-bg" role="presentation" cellpadding="0" cellspacing="0" border="0" width="420"
       style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; width:420px; max-width:420px; background-color:#ffffff; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <tr>
    <td style="padding:14px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
             style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

  <!-- Logo -->
  <tr>
    <td style="padding:0 0 12px 0;">
      <!--
        A transparent-PNG logo in brand-dark ink vanishes on a dark background,
        and no CSS fixes it because clients don't recolour image pixels. So the
        logo is swapped at the source: <picture> serves the light-ink version
        on light and the light-ink-inverted version on dark. Apple Mail and iOS
        Mail honour it; Gmail and Outlook ignore <source> and fall through to
        the <img>, which is why the fallback is the version that reads on white.
      -->
      <picture>
        <source srcset="https://dardrezniqi.github.io/email-signatures/logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="https://dardrezniqi.github.io/email-signatures/logo.png"
             width="132" height="32" alt="Dard Rezniqi"
             style="display:block; width:132px; height:32px; border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic;">
      </picture>
    </td>
  </tr>

  <!-- Name -->
  <tr>
    <td class="sig-name" style="padding:0 0 1px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:18px; line-height:24px; mso-line-height-rule:exactly; font-weight:700; color:#1a1a1c; letter-spacing:-0.2px;">
      Dard Rezniqi
    </td>
  </tr>

  <tr>
    <td class="sig-role" style="padding:0 0 12px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:18px; mso-line-height-rule:exactly; color:#6e6e73;">
      Software Developer
    </td>
  </tr>

  <tr>
    <td class="sig-hair" height="1" style="height:1px; font-size:0; line-height:0; background-color:#e3e3e6;">&nbsp;</td>
  </tr>
  <tr>
    <td height="12" style="height:12px; font-size:0; line-height:0;">&nbsp;</td>
  </tr>

  <!-- Labelled contact rows -->
  <tr>
    <td style="padding:0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
             style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">

        <tr>
          <td class="sig-label" valign="top" width="52" style="width:52px; padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:11px; line-height:20px; mso-line-height-rule:exactly; color:#8e8e93; text-transform:uppercase; letter-spacing:0.6px;">Tel</td>
          <td class="sig-meta" valign="top" style="padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; mso-line-height-rule:exactly; color:#3a3a3c;">
            <a href="tel:+38349812525" style="color:#3a3a3c; text-decoration:none;">+383 49 812 525</a>
          </td>
        </tr>

        <tr>
          <td class="sig-label" valign="top" width="52" style="width:52px; padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:11px; line-height:20px; mso-line-height-rule:exactly; color:#8e8e93; text-transform:uppercase; letter-spacing:0.6px;">Email</td>
          <td class="sig-meta" valign="top" style="padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; mso-line-height-rule:exactly; color:#3a3a3c;">
            <a href="mailto:dard.rezniqi@gmail.com" style="color:#3a3a3c; text-decoration:none;">dard.rezniqi@gmail.com</a>
          </td>
        </tr>

        <tr>
          <td class="sig-label" valign="top" width="52" style="width:52px; padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:11px; line-height:20px; mso-line-height-rule:exactly; color:#8e8e93; text-transform:uppercase; letter-spacing:0.6px;">Office</td>
          <td class="sig-meta" valign="top" style="padding:0 0 5px 0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; mso-line-height-rule:exactly; color:#3a3a3c;">
            <a href="https://maps.google.com/?q=Prishtina,%20Kosovo" style="color:#3a3a3c; text-decoration:none;">Prishtina, Kosovo</a>
          </td>
        </tr>

        <tr>
          <td class="sig-label" valign="top" width="52" style="width:52px; padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:11px; line-height:20px; mso-line-height-rule:exactly; color:#8e8e93; text-transform:uppercase; letter-spacing:0.6px;">Web</td>
          <td class="sig-accent" valign="top" style="padding:0; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:13px; line-height:20px; mso-line-height-rule:exactly; color:#15803d;">
            <a href="https://github.com/dardrezniqi" style="color:#15803d; text-decoration:none; font-weight:600;">github.com/dardrezniqi</a>
          </td>
        </tr>

      </table>
    </td>
  </tr>
      </table>
    </td>
  </tr>

</table>
<!-- ===== SIGNATURE END ===== -->

</body>
</html>
